<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Translate</title>
    
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/index.css">
    <link rel="icon" href="../static/img/favicon_1.ico">

    <!-- Fonts and icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cuprum&family=Merriweather:ital,wght@1,300&family=Montserrat&family=Open+Sans&family=Roboto&family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Carattere&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/872673ab28.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="nav_head">
        <div class="nav_title"><h1 style="margin-top:15px;">Realtime Sign Language Translator</h1></div>
        <div class="icons">
            <ul class="header-list">
                <li class="header-list-elements"><a class="link-tag" id="profile_page" href='./profile'>Profile</a></li>
                <li class="header-list-elements"><a class="link-tag" href="/about">About</a></li>
                <li class="header-list-elements"><a class="link-tag" href="/home">Home</a></li>
                <li class="header-list-elements"><a class="link-tag" href="https://github.com/Deva0813/Realtime-Communication-System" target="_blank"><i class="fa-brands fa-github"></i></a></li>
            </ul>        
        </div>
    </div>

    <div class="main">
        <div class="cont">
            <div class="flex">
                <div class="output_1">
                    <div class="cent"> 
                        <h1>Video Output</h1>
                    </div>   
                    <div class="cent">
                        <div class="video_stream">
                            <img src="{{ url_for('video') }}">
                        </div>  
                    </div>
                </div>

                <div class="output_2">
                    <div class="cent">
                        <h1>Predicted Text</h1>
                    </div>
                    <div class="cent">
                        <div class="P_txt">
                            <h1 class="txt"> <span id="txt">-</span> </h1>
                        </div> 
                    </div>
                </div>
            </div>

            <p>The above program predicts the sign language gesture using a trained YOLOv8 model</p>
            <div class="btn">
                <a href="/home" class="an">Stop Translate</a>
            </div>
        </div>
    </div>

    <footer>
        <p id="copyrights" style="color: #474E68; font-size:15px;"></p>
    </footer>

    <script>
        // Auto update copyright
        document.getElementById("copyrights").innerHTML = "Copyright © " + new Date().getFullYear();

        // Fetch predicted label every 500ms
        setInterval(function () {
            fetch('/label')
                .then(response => response.json())
                .then(data => {
                    document.getElementById("txt").textContent = data;
                });
        }, 500);
    </script>
</body>
</html>
